<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Dealerships</title>
    <link rel="stylesheet" href="/static/bootstrap.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Dealerships</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="/about">About Us</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/contact">Contact Us</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-5">
        <div class="card shadow-lg border-0 rounded">
            <div class="card-body p-5">
                <div class="row">
                    <div class="col-md-5 bg-dark text-white p-4 rounded d-flex flex-column justify-content-between">
                        <div>
                            <h3 class="mb-3">Get in Touch</h3>
                            <p class="text-muted">Questions about a dealership branch or customer reviews? Reach our team anytime.</p>
                            <p class="mt-4 mb-2">📍 <strong>Headquarters:</strong> 100 Motor City Blvd, Detroit, MI 48201</p>
                            <p class="mb-2">📧 <strong>Email:</strong> support@dealerships.com</p>
                            <p class="mb-2">📞 <strong>Phone:</strong> +1 (800) 555-CARS</p>
                        </div>
                        <img src="https://images.unsplash.com/photo-1560179707-f14e90ef3623?w=400" class="img-fluid rounded mt-4" alt="Office Building">
                    </div>
                    <div class="col-md-7 ps-md-4">
                        <h2 class="h4 mb-4">Send us a Message</h2>
                        <form>
                            <div class="mb-3">
                                <label class="form-label">Full Name</label>
                                <input type="text" class="form-control" placeholder="Jane Doe" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Email Address</label>
                                <input type="email" class="form-control" placeholder="jane@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Message</label>
                                <textarea class="form-control" rows="4" placeholder="How can we assist you today?" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Submit Inquiry</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
